faqs:
  - q: ¿Qué es el desarrollo de software a medida?
    a: >-
      Es construir un sistema pensado para las reglas, los usuarios y los procesos de un negocio en
      particular, en lugar de adaptar el negocio a una herramienta genérica. El resultado es un
      producto propio: el código, los datos y la evolución dependen de vos.
  - q: ¿Qué significa que una plataforma sea multi-tenant?
    a: >-
      Que una misma aplicación atiende a varias organizaciones (tenants) y cada una ve solo sus datos,
      usuarios y configuración. Es la arquitectura típica de un SaaS. Markish Arena funciona así: cada
      box o gimnasio opera su competencia de forma independiente con su propia marca.
  - q: ¿Se puede conectar la aplicación con APIs externas?
    a: >-
      Sí. Integramos servicios externos mediante sus APIs o webhooks: envío de emails, almacenamiento
      de archivos, notificaciones push, inicio de sesión con Google y otros sistemas que expongan una API.
  - q: ¿Cómo se desarrolla una plataforma escalable?
    a: >-
      Separando responsabilidades desde el inicio: una API con reglas de negocio centralizadas, una
      base de datos bien modelada, colas para el trabajo pesado o diferido, caché donde hace falta y
      monitoreo para detectar problemas antes que los usuarios. Escalar no es solo sumar servidores:
      es que el código y los datos permitan crecer sin reescribir todo.
