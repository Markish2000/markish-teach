faqs:
  - q: ¿Qué es WCAG 2.2 AA?
    a: >-
      WCAG (Web Content Accessibility Guidelines) es el estándar internacional del W3C para la
      accesibilidad web. La versión 2.2 se publicó en 2023 y el nivel AA es el que suelen exigir
      normativas y contratos: incluye contraste mínimo, uso con teclado, foco visible, textos
      alternativos y formularios comprensibles, entre otros criterios.
  - q: ¿Un Lighthouse de 100 en accesibilidad significa que el sitio es accesible?
    a: >-
      No. Las herramientas automáticas detectan solo una parte de los problemas. Cosas como el orden
      lógico del foco, si un texto alternativo describe bien la imagen o si un flujo se entiende con
      lector de pantalla requieren pruebas manuales.
  - q: ¿Sirven los widgets o plugins que prometen accesibilidad automática?
    a: >-
      En general no resuelven los problemas de fondo, que están en el HTML y el diseño, y a veces
      interfieren con las tecnologías de asistencia que la persona ya usa. Recomendamos corregir el
      código.
