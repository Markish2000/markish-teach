faqs:
  - q: ¿Qué son las Core Web Vitals?
    a: >-
      Son tres métricas de Google sobre la experiencia real de carga: LCP (cuánto tarda en verse el
      contenido principal, idealmente 2,5 s o menos), INP (qué tan rápido responde la página a una
      interacción, idealmente 200 ms o menos) y CLS (cuánto se mueve el contenido mientras carga,
      idealmente 0,1 o menos).
  - q: ¿Cómo se moderniza un sitio sin perder posicionamiento SEO?
    a: >-
      Haciendo un inventario de URLs con tráfico y enlaces, manteniendo las mismas URLs o redirigiendo
      cada una con 301 a su equivalente, conservando títulos y contenidos que funcionan, migrando datos
      estructurados y verificando en Search Console después de publicar. El error más común es cambiar
      todas las URLs sin redirecciones.
  - q: ¿Garantizan el primer puesto en Google?
    a: >-
      No. Nadie puede garantizarlo de forma honesta. Lo que sí garantizamos es corregir los problemas
      técnicos medibles que impiden que tu sitio compita, y mostrarte la evidencia antes y después.
  - q: ¿Un Lighthouse 100 asegura buen posicionamiento?
    a: >-
      No. Lighthouse mide en laboratorio y es una guía útil, pero Google usa datos de usuarios reales y
      muchos otros factores, sobre todo la relevancia del contenido. Un buen puntaje elimina obstáculos
      técnicos; no reemplaza un contenido útil.
