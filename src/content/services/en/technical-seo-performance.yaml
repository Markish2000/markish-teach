deliverables:
  - title: Technical audit
    text: Prioritized report on indexing, metadata, links, structured data, performance and accessibility, with evidence for every finding.
  - title: Indexing and crawling
    text: robots.txt, XML sitemap, canonical tags, redirects, status codes and orphan pages.
  - title: Structured data
    text: JSON-LD for Organization, WebSite, Service, BreadcrumbList and whatever types match the real content.
  - title: International SEO
    text: Per-language URLs, reciprocal hreflang with x-default, self-referencing canonical tags and translated metadata.
  - title: Core Web Vitals
    text: LCP, INP and CLS improvements through responsive images, optimized fonts, less JavaScript and caching.
  - title: Continuous measurement
    text: Automated tests that catch SEO and performance regressions before release.
method:
