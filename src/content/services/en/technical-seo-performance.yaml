faqs:
  - q: What are Core Web Vitals?
    a: >-
      Three Google metrics about real loading experience: LCP (how long the main content takes to
      appear, ideally 2.5 s or less), INP (how quickly the page responds to an interaction, ideally
      200 ms or less) and CLS (how much content shifts while loading, ideally 0.1 or less).
  - q: How do you modernize a site without losing SEO rankings?
    a: >-
      By inventorying URLs with traffic and links, keeping the same URLs or redirecting each one with
      a 301 to its equivalent, preserving titles and content that work, migrating structured data and
      verifying in Search Console after launch. The most common mistake is changing every URL without
      redirects.
  - q: Do you guarantee the top spot on Google?
    a: >-
      No. Nobody can honestly guarantee that. What we do guarantee is fixing the measurable technical
      problems that stop your site from competing, and showing you the evidence before and after.
  - q: Does a Lighthouse score of 100 guarantee good rankings?
    a: >-
      No. Lighthouse measures in a lab and is a useful guide, but Google uses real-user data and many
      other factors, above all content relevance. A good score removes technical obstacles; it
      doesn't replace useful content.
