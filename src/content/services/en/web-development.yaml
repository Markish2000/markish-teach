faqs:
  - q: What's the difference between a custom site and a template?
    a: >-
      A template ships generic design and code meant for many cases, so it usually loads more than
      needed and is hard to adapt. A custom site is built for your pages and content: it loads only
      what it uses, respects your brand and can be extended without fighting someone else's code.
  - q: Do you use Astro or Next.js?
    a: >-
      It depends on the project. For mostly content sites (company sites, landing pages, event sites)
      Astro delivers static HTML with very little JavaScript, which helps speed and SEO. When the site
      needs heavy interaction, user sessions or server logic, Next.js is usually the better choice.
      This site is built with Astro and FORJA Challenge with Next.js.
  - q: Can you redesign my site without losing my Google rankings?
    a: >-
      Yes. Before changing anything we list the URLs that receive traffic, keep each one or redirect
      it with a 301, preserve titles and content that work, and verify in Search Console after launch.
  - q: Will the site work on phones?
    a: >-
      Yes. We design mobile-first and automatically test that there is no horizontal overflow at
      320, 768 and 1280 px widths.
