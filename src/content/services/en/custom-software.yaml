faqs:
  - q: What is custom software development?
    a: >-
      It means building a system designed around a specific business's rules, users and processes,
      instead of adapting the business to a generic tool. The result is a product you own: the code,
      the data and its evolution depend on you.
  - q: What does it mean for a platform to be multi-tenant?
    a: >-
      One application serves several organizations (tenants) and each one only sees its own data,
      users and settings. It's the typical SaaS architecture. Markish Arena works this way: each gym
      runs its competition independently with its own branding.
  - q: Can the application connect to external APIs?
    a: >-
      Yes. We integrate external services through their APIs or webhooks: email delivery, file
      storage, push notifications, Google sign-in and any other system that exposes an API.
  - q: How do you build a scalable platform?
    a: >-
      By separating responsibilities from the start: an API with centralized business rules, a
      well-modeled database, queues for heavy or deferred work, caching where needed and monitoring
      to catch problems before users do. Scaling isn't just adding servers: it's code and data that
      let you grow without rewriting everything.
