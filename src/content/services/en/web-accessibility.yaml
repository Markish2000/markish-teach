faqs:
  - q: What is WCAG 2.2 AA?
    a: >-
      WCAG (Web Content Accessibility Guidelines) is the W3C's international web accessibility
      standard. Version 2.2 was published in 2023 and level AA is what regulations and contracts
      usually require: minimum contrast, keyboard use, visible focus, text alternatives and
      understandable forms, among other criteria.
  - q: Does a Lighthouse accessibility score of 100 mean the site is accessible?
    a: >-
      No. Automated tools only catch part of the problems. Things like a logical focus order, whether
      alt text actually describes the image or whether a flow makes sense with a screen reader need
      manual testing.
  - q: Do accessibility overlay widgets work?
    a: >-
      Generally they don't fix the underlying problems, which live in the HTML and the design, and
      they sometimes interfere with the assistive technology people already use. We recommend fixing
      the code.
